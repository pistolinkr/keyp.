# W1–W5 mitigations: static guards on every PR; RLS smoke is optional (manual / scheduled).
name: security-checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Security static guards
        run: node scripts/security/static-guards.mjs
      - name: Typecheck
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run check

